AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CardDemo Transaction Report - Serverless (COBOL to Python)

Resources:
  TransactionReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../modern_python/
      Handler: lambda_function.handler
      Runtime: python3.11
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          CARDDATA_DIR: ""
      Events:
        ReportApi:
          Type: Api
          Properties:
            Path: /report
            Method: post
        DailyUpload:
          Type: S3
          Properties:
            Bucket: !Ref TransactionDataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: dailytran.txt

  TransactionDataBucket:
    Type: AWS::S3::Bucket
